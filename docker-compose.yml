version: '3.8'

services:
  svelte-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Force Vite to use polling if standard HMR file watching fails
      - CHOKIDAR_USEPOLLING=true
  npm-only:
    build:
      context: .
      dockerfile: Dockerfile.npm
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
